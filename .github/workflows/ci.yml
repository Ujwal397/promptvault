# Release gate (PRD §15.1): every push/PR must pass all security-relevant checks.
# Hardening note: pin each action to a full commit SHA before production use.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit, integration, property, governance and eval-gate tests (with coverage)
        run: npm run test:coverage
      - name: Extended fuzzing
        run: npm run fuzz
        env:
          FUZZ_RUNS: '2000'
      - name: Corpus metrics report
        run: npm run eval
      - name: Dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=moderate
      - name: License allowlist
        run: npm run check:licenses
      - name: Reproducible build, no source maps, CSP present
        run: npm run check:build
      - name: SBOM (CycloneDX)
        run: npm run sbom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Privacy egress, offline and cross-browser tests
        run: npm run e2e

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
